[project]
name = "mambacls"
version = "0.1.0"
description = "Mamba-2 / Mamba-3 sequence classifiers and an end-to-end comparison workbench"
requires-python = ">= 3.10"
dependencies = [
    "mamba_ssm",            # install from source (needed for Mamba-3); pin the commit SHA in the lockfile
    "torch",
    "einops",
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "datasets",
    "transformers",
    "hydra-core>=1.3",
    "omegaconf",
    "pyarrow",
    "duckdb",
    "zarr>=3",
    "plotly>=5.20",
    "dash>=2.16",
]

[project.optional-dependencies]
umap = ["umap-learn"]
tracking = ["wandb"]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mambacls*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
